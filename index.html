<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Название вашего сайта</title>
    
    <!-- Сюда можно подключить внешний файл стилей (CSS) -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Шапка сайта (логотип, навигация) -->
    <header>
        <nav>
            <ul>
                <li><a href="#">Главная</a></li>
                <li><a href="#">О нас</a></li>
                <li><a href="#">Контакты</a></li>
            </ul>
        </nav>
    </header>

    <!-- Основной контент страницы -->
    <main>
        <section>
            <h1>Добро пожаловать на сайт!</h1>
            <p>Это универсальная структура. Замените этот текст на свой контент.</p>
            <button type="button">Узнать больше</button>
        </section>
    </main>

    <!-- Подвал сайта (авторские права, ссылки) -->
    <footer>
        <p>&copy; 2026 Все права защищены.</p>
    </footer>

    <!-- Сюда обычно подключают скрипты (JavaScript), чтобы сайт не тормозил при загрузке -->
    <script src="script.js"></script>
</body>
</html>
